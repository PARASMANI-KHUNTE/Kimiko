name: Kimiko CI Pipeline

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  test:
    name: Backend Test Suite (Pytest)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pydantic pydantic-settings fastapi pytest pytest-asyncio anyio httpx structlog "sqlalchemy[asyncio]" greenlet asyncpg alembic qdrant-client

      - name: Run Schema and Unit Tests
        env:
          PYTHONPATH: src
        run: |
          pytest tests/test_schemas.py tests/test_perf_primitives.py tests/test_core.py -v
