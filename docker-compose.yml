# ============================================================
# Kimiko AI — Docker Compose (Local Development)
# ============================================================
# Services: API, Redis, PostgreSQL, Qdrant, Ollama
# GPU passthrough configured for NVIDIA (Fix #9 review round 2)
# ============================================================

services:
  # ── Kimiko API ──
  kimiko-api:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: kimiko-api
    ports:
      - "8000:8000"
    environment:
      - KIMIKO_ENV=development
      - KIMIKO_API_DEBUG=true
      - KIMIKO_DEBUG_PROMPT=true
      - KIMIKO_REDIS_URL=redis://redis:6379/0
      - KIMIKO_CELERY_BROKER_URL=redis://redis:6379/1
      - KIMIKO_DATABASE_URL=postgresql+asyncpg://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/kimiko
      - KIMIKO_QDRANT_URL=http://qdrant:6333
      # Call the Ollama instance running on the host, not the opt-in container.
      # Override with KIMIKO_DOCKER_OLLAMA_BASE_URL when Ollama lives elsewhere.
      - KIMIKO_OLLAMA_BASE_URL=${KIMIKO_DOCKER_OLLAMA_BASE_URL:-http://host.docker.internal:11434}
      - KIMIKO_DEFAULT_MODEL=${KIMIKO_DEFAULT_MODEL:-qwen3.5:4b}
      - KIMIKO_EMBEDDING_MODEL=${KIMIKO_EMBEDDING_MODEL:-embeddinggemma-2:270m}
      - KIMIKO_API_SECRET_KEY=${KIMIKO_API_SECRET_KEY}
    # host.docker.internal is automatic on Docker Desktop; this also covers
    # Linux hosts where it must be mapped explicitly.
    extra_hosts:
      - "host.docker.internal:host-gateway"
    depends_on:
      redis:
        condition: service_healthy
      postgres:
        condition: service_healthy
      qdrant:
        condition: service_started
    networks:
      - kimiko-net
    restart: unless-stopped

  # ── Redis ──
  redis:
    image: redis:7-alpine
    container_name: kimiko-redis
    ports:
      - "6379:6379"
    volumes:
      - redis-data:/data
    command: redis-server --appendonly yes --maxmemory 512mb --maxmemory-policy allkeys-lru
    healthcheck:
      test: [ "CMD", "redis-cli", "ping" ]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - kimiko-net
    restart: unless-stopped

  # ── PostgreSQL ──
  postgres:
    image: postgres:16-alpine
    container_name: kimiko-postgres
    ports:
      - "5432:5432"
    environment:
      POSTGRES_DB: kimiko
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U kimiko -d kimiko" ]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - kimiko-net
    restart: unless-stopped

  # ── Qdrant ──
  qdrant:
    image: qdrant/qdrant:latest
    container_name: kimiko-qdrant
    ports:
      - "6333:6333"
      - "6334:6334"
    volumes:
      - qdrant-data:/qdrant/storage
    environment:
      QDRANT__SERVICE__GRPC_PORT: 6334
    networks:
      - kimiko-net
    restart: unless-stopped

  # ── Ollama (optional, opt-in) ──
  # The default stack uses the Ollama installation on the host (usually with
  # GPU already configured). Enable this service only if you want a container
  # bundled with the stack:
  #   docker compose --profile docker-ollama up -d
  ollama:
    image: ollama/ollama:latest
    container_name: kimiko-ollama
    profiles: ["docker-ollama"]
    ports:
      - "11434:11434"
    volumes:
      - ollama-data:/root/.ollama
    # GPU passthrough for NVIDIA (Fix #9 review round 2)
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [ gpu ]
    networks:
      - kimiko-net
    restart: unless-stopped

  # ── Celery Worker ──
  kimiko-worker:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: kimiko-worker
    command: >
      python -m celery -A kimiko.workers worker --loglevel=info --concurrency=2
    environment:
      - KIMIKO_ENV=development
      - KIMIKO_REDIS_URL=redis://redis:6379/0
      - KIMIKO_CELERY_BROKER_URL=redis://redis:6379/1
      - KIMIKO_DATABASE_URL=postgresql+asyncpg://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/kimiko
      - KIMIKO_QDRANT_URL=http://qdrant:6333
      - KIMIKO_OLLAMA_BASE_URL=${KIMIKO_DOCKER_OLLAMA_BASE_URL:-http://host.docker.internal:11434}
      - KIMIKO_DEFAULT_MODEL=${KIMIKO_DEFAULT_MODEL:-qwen3.5:4b}
      - KIMIKO_EMBEDDING_MODEL=${KIMIKO_EMBEDDING_MODEL:-embeddinggemma-2:270m}
    extra_hosts:
      - "host.docker.internal:host-gateway"
    depends_on:
      redis:
        condition: service_healthy
      postgres:
        condition: service_healthy
    # The image healthcheck probes the HTTP API, which a Celery worker does not
    # serve. Without this the worker reports "unhealthy" forever.
    healthcheck:
      disable: true
    networks:
      - kimiko-net
    restart: unless-stopped

networks:
  kimiko-net:
    driver: bridge

volumes:
  redis-data:
  postgres-data:
  qdrant-data:
  ollama-data:
