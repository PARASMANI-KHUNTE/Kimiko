[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "kimiko"
version = "0.1.0"
description = "Kimiko AI — Intelligent AI middleware platform"
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"

dependencies = [
    # Web framework
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.30.0",
    "sse-starlette>=2.0.0",
    "websockets>=13.0",

    # HTTP client
    "httpx>=0.27.0",

    # Database
    "sqlalchemy[asyncio]>=2.0.0",
    "asyncpg>=0.30.0",
    "alembic>=1.14.0",

    # Redis
    "redis[hiredis]>=5.0.0",

    # Vector DB
    "qdrant-client>=1.12.0",

    # Auth & security
    "python-jose[cryptography]>=3.3.0",
    "passlib[bcrypt]>=1.7.4",

    # Configuration
    "pydantic>=2.0.0",
    "pydantic-settings>=2.0.0",
    "python-dotenv>=1.0.0",

    # Background tasks
    "celery[redis]>=5.4.0",

    # Observability
    "prometheus-client>=0.21.0",
    "structlog>=24.0.0",

    # Resilience
    "tenacity>=9.0.0",
 
    # Phase 2: Agents & Tools (Fix #3 review round 3)
    "langgraph>=0.2.0",
    "langchain-core>=0.3.0",
    "duckduckgo-search>=6.0.0",
    "pypdf>=5.0.0",
    "python-multipart>=0.0.9",
    "faster-whisper>=1.0.0",
    "piper-tts>=1.2.0",
    "soundfile>=0.12.1",
    "uvloop>=0.19.0; sys_platform != 'win32'",
    "Pillow>=10.0.0",
    "psutil>=5.9.0",
    "pytesseract>=0.3.10",
    "opencv-python>=4.8.0",
    "uiautomation>=2.0.0",
    "pywinauto>=0.6.8",
]

[project.scripts]
kimiko = "kimiko.interface.cli:main"

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.24.0",
    "pytest-cov>=5.0.0",
    "httpx>=0.27.0",
    "ruff>=0.8.0",
    "mypy>=1.13.0",
]

[tool.hatch.build.targets.wheel]
packages = ["src/kimiko"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "N", "W", "UP"]
